# Serves the built admin (SPA) and forwards the API, uploads and SignalR to the "api" container, so the browser sees one origin.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's DNS, asked again every 10 s (a recreated API container gets a new IP).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Angular and PrimeNG set inline styles; scripts come only from this origin. Images may be data: URIs or uploads (same origin);
    # blob: is for files opened from the admin; connect-src covers the API and SignalR (ws/wss) on this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    set $api http://api:8080;

    location /api/    { proxy_pass $api; include /etc/nginx/proxy-common.conf; }
    location /uploads/ { proxy_pass $api; include /etc/nginx/proxy-common.conf; }
    location /swagger { proxy_pass $api; include /etc/nginx/proxy-common.conf; }
    location /hubs/ {
        proxy_pass $api;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed files never change: cache for a year. index.html must always be fetched again.
    location ~* \.(js|css|woff2?|ico|svg|png|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
